name: One-time RF Open Source Research
# Second invocation: sync authored corpus, validate and mark review-ready (not concluded).
on:
  push:
    branches: [docs/p1-technology-selection]
    paths: [.github/workflows/create-research.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p1-technology-selection
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RepoFoundryAI
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsSL https://raw.githubusercontent.com/XiaoWeiKIN/RepoFoundryAI/v0.15.1/install.py -o "$RUNNER_TEMP/installer.py"
          python3 "$RUNNER_TEMP/installer.py" --version 0.15.1 --host none
      - name: Create or synchronize official Research artifact
        shell: bash
        run: |
          set -euo pipefail
          RF_ROOT="$(find "$HOME/.local/share/repofoundry-ai" -path '*/engineering-research/scripts/researchctl.py' -type f | head -n 1)"
          if [[ -z "$RF_ROOT" ]]; then
            echo 'No official researchctl found' >&2
            exit 1
          fi
          python3 "$RF_ROOT" --repo . init
          if [[ ! -f docs/research/active/r-001_opamp-oss-architecture/RESEARCH.md ]]; then
            python3 "$RF_ROOT" --repo . new-research --slug opamp-oss-architecture --title "Open-source architecture patterns for OpAMP Control Plane" --research-type comparative --author "AI assistant" --owner "Unassigned"
          else
            python3 "$RF_ROOT" --repo . sync-research R-001
            python3 "$RF_ROOT" --repo . validate
            python3 "$RF_ROOT" --repo . mark-review-ready R-001 --snapshot
            python3 "$RF_ROOT" --repo . validate
          fi
      - name: Commit official Research artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'docs: create or synchronize RF Research on OSS architecture'
            git push origin HEAD:docs/p1-technology-selection
          fi
