name: Temporary P2.3b gofmt
on:
  push:
    branches:
      - feat/p23-ws-push-recovery
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p23-ws-push-recovery
      - name: Format P2.3b Go files
        run: |
          set -euo pipefail
          gofmt -w cmd/server/ws_push.go cmd/server/ws_push_integration_test.go cmd/server/main.go cmd/server/releases.go internal/storage/gormrepo/reconcile.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/server/ws_push.go cmd/server/ws_push_integration_test.go cmd/server/main.go cmd/server/releases.go internal/storage/gormrepo/reconcile.go
          git commit -m "style: gofmt P2.3b WS push implementation"
          git push origin HEAD:feat/p23-ws-push-recovery
