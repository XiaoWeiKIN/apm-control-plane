name: Install RepoFoundryAI
on:
  push:
    branches: [feat/opamp-control-plane-p0]
    paths:
      - .github/workflows/bootstrap-repofoundry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opamp-control-plane-p0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned RepoFoundryAI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/XiaoWeiKIN/RepoFoundryAI/v0.15.1/install.py \
            --output "$RUNNER_TEMP/repofoundry-install.py"
          python3 "$RUNNER_TEMP/repofoundry-install.py" --version 0.15.1 --host none
          "$HOME/.local/bin/repofoundry" --help
      - name: Preview and apply project Harness with all adapters and relevant Specs
        shell: bash
        run: |
          set -euo pipefail
          RF="$HOME/.local/bin/repofoundry"
          SPECS=(
            --spec languages/go
            --spec languages/go/performance
            --spec languages/go/functional-options
            --spec languages/go/factory-delegation
            --spec documentation/technical-documentation
            --spec documentation/derived-explanations
          )
          "$RF" --repo . bootstrap --all-adapters "${SPECS[@]}" > "$RUNNER_TEMP/repofoundry-preview.txt"
          cat "$RUNNER_TEMP/repofoundry-preview.txt"
          "$RF" --repo . bootstrap --all-adapters "${SPECS[@]}" --apply
          "$RF" --repo . validate
          "$RF" --repo . spec validate
      - name: Initialize professional governance registries
        shell: bash
        run: |
          set -euo pipefail
          RF_ROOT="$HOME/.local/share/repofoundry-ai"
          EPCTL="$(find "$RF_ROOT" -type f -path '*/engineering-execution-plan/scripts/epctl.py' -print -quit)"
          DESIGNCTL="$(find "$RF_ROOT" -type f -path '*/engineering-design/scripts/designctl.py' -print -quit)"
          test -n "$EPCTL"
          test -n "$DESIGNCTL"
          python3 "$EPCTL" --repo . init
          python3 "$DESIGNCTL" --repo . init
          "$HOME/.local/bin/repofoundry" --repo . validate
      - name: Verify Go baseline
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go test -race ./...
          go vet ./...
      - name: Commit generated project Harness and Spec lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; RepoFoundry Harness already installed."
          else
            git commit -m "chore: bootstrap RepoFoundryAI v0.15.1 [skip ci]"
            git push origin HEAD:feat/opamp-control-plane-p0
          fi
