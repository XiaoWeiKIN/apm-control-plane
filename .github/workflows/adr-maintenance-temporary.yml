name: Temporary ADR maintenance audit
on:
  push:
    branches:
      - docs/blk002-agent-principal-adr-proposal
    paths:
      - .github/workflows/adr-maintenance-temporary.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical ADR maintenance check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/XiaoWeiKIN/RepoFoundryAI/v0.15.1/install.py \
            --output "$RUNNER_TEMP/repofoundry-install.py"
          python3 "$RUNNER_TEMP/repofoundry-install.py" --version 0.15.1 --host none
          EPCTL="$(find "$HOME/.local/share/repofoundry-ai" -type f -path '*/engineering-execution-plan/scripts/epctl.py' -print -quit)"
          test -n "$EPCTL"
          python3 "$EPCTL" --repo . validate
          python3 "$EPCTL" --repo . adr-maintenance --json
