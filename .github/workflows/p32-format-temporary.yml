name: Temporary P3.2 test format
on:
  push:
    branches:
      - feat/p32-policy-rollout-recovery
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p32-policy-rollout-recovery
      - name: Format added P3.2 integration tests
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/storage/gormrepo/p32_policy_rollouts_integration_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/storage/gormrepo/p32_policy_rollouts_integration_test.go
          git commit -m "style: gofmt P3.2 added rollback test"
          git push origin HEAD:feat/p32-policy-rollout-recovery
