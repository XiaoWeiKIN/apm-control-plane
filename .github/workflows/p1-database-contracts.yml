name: P1 Database Contracts

on:
  pull_request:
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "db/migrations/**"
      - ".github/workflows/p1-database-contracts.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/p1-database-contracts.yml"
  push:
    branches:
      - main
      - feat/p1-durable-agent-inventory
    paths:
      - "cmd/server/**"
      - "internal/**"
      - "db/migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/p1-database-contracts.yml"

jobs:
  database-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: controlplane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d controlplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: controlplane
          MYSQL_USER: app
          MYSQL_PASSWORD: testpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpass"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      APM_TEST_POSTGRES_DSN: postgres://app:testpass@127.0.0.1:5432/controlplane?sslmode=disable
      APM_TEST_MYSQL_DSN: "app:testpass@tcp(127.0.0.1:3306)/controlplane?parseTime=true&loc=UTC"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: true
      - name: Require read access to private DataFox Schema
        env:
          SCHEMA_READ_TOKEN: ${{ secrets.DATAFOX_SCHEMA_READ_TOKEN }}
        run: |
          if [ -z "$SCHEMA_READ_TOKEN" ]; then
            echo "DATAFOX_SCHEMA_READ_TOKEN is required for private schema migration tests"
            exit 1
          fi
          git config --global url."https://x-access-token:${SCHEMA_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/datafoxlabs/*" >> "$GITHUB_ENV"
      - name: Checkout DataFox Schema
        uses: actions/checkout@v4
        with:
          repository: datafoxlabs/datafox-schema
          ref: refactor/controlplane-schema-migration
          token: ${{ secrets.DATAFOX_SCHEMA_READ_TOKEN }}
          path: .datafox-schema
      - name: Build DataFox Schema CLI
        shell: bash
        run: python3 .datafox-schema/scripts/build-local.py
      - name: Initialize PostgreSQL and MySQL via DataFox Schema
        shell: bash
        run: |
          set -euo pipefail
          DATAFOX_SCHEMA_DSN="$APM_TEST_POSTGRES_DSN" \
            .datafox-schema/bin/datafox-schema migrate up --domain=admin
          DATAFOX_SCHEMA_DSN="mysql://app:testpass@127.0.0.1:3306/controlplane" \
            .datafox-schema/bin/datafox-schema migrate up --domain=admin
      - name: Exercise identical real-engine repository contracts
        shell: bash
        run: |
          set -euo pipefail
          go test -tags=integration -race -count=1 -v ./cmd/server ./internal/storage/gormrepo
