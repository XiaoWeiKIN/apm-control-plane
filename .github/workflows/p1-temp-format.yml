name: P1 Temporary Formatting

on:
  push:
    branches:
      - fix/p1-agent-inventory-reliability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Format source and module manifests
        run: |
          gofmt -w cmd internal
          go mod tidy
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd internal go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Go source and normalize module manifests'
            git push origin HEAD:fix/p1-agent-inventory-reliability
          fi
