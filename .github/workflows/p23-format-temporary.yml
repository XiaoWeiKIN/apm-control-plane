name: Temporary P2.3 gofmt
on:
  push:
    branches:
      - feat/p2-reconcile-opamp-ack
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-reconcile-opamp-ack
      - name: Format changed P2.3 Go files
        run: |
          set -euo pipefail
          gofmt -w cmd/server/reconcile_integration_test.go internal/storage/gormrepo/reconcile.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/server/reconcile_integration_test.go internal/storage/gormrepo/reconcile.go
          git commit -m "style: gofmt P2.3 ACK regression coverage"
          git push origin HEAD:feat/p2-reconcile-opamp-ack
