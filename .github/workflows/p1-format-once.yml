name: One-time P1 Formatting
on:
  push:
    branches: [feat/p1-durable-agent-inventory]
    paths: [.github/workflows/p1-format-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-durable-agent-inventory
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd internal
          go mod tidy
          go test ./...
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if ! git diff --cached --quiet; then
            git commit -m 'style: format P1 Go implementation'
            git fetch origin feat/p1-durable-agent-inventory
            git rebase origin/feat/p1-durable-agent-inventory
            git push origin HEAD:feat/p1-durable-agent-inventory
          fi
