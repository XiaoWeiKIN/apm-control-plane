name: P2.2 Temporary Go Formatting

on:
  push:
    branches:
      - feat/p2-atomic-agent-release

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Normalize source and commit if needed
        run: |
          set -euo pipefail
          gofmt -w cmd/server/releases.go cmd/server/releases_test.go cmd/server/releases_integration_test.go internal/storage/gormrepo/store.go internal/storage/gormrepo/releases.go internal/storage/gormrepo/releases_integration_test.go
          go mod tidy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/server internal/storage/gormrepo go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'style: gofmt P2.2 release implementation and tests'
            git push origin HEAD:feat/p2-atomic-agent-release
          fi
