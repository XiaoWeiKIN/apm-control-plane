name: One-time P1 Dependency Bootstrap
# Re-run for corrected P1 protocol state and connection tests.
on:
  push:
    branches: [feat/p1-durable-agent-inventory]
    paths:
      - .github/workflows/p1-bootstrap-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-durable-agent-inventory
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: true
      - name: Pin P1 dependencies and format Go
        shell: bash
        run: |
          set -euo pipefail
          go get gorm.io/gorm@v1.31.2
          go get gorm.io/driver/postgres@v1.6.0 gorm.io/driver/mysql@v1.6.0
          go get github.com/knadh/koanf/v2@v2.4.1
          go mod tidy
          gofmt -w cmd internal
          go test ./...
          go vet ./...
      - name: Commit code formatting and Go locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock GORM and Koanf dependencies, format P1 implementation'
            git push origin HEAD:feat/p1-durable-agent-inventory
          fi
