name: Go CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
