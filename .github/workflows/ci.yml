name: Go CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check Go source formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\\n%s\\n' "$unformatted"
            exit 1
          fi
      - name: Check reproducible module manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
