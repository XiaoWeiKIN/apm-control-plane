name: Temporary canonical ADR reindex

on:
  push:
    branches:
      - docs/blk002-agent-principal-adr-proposal
    paths:
      - .github/workflows/adr-reindex-temporary.yml

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/blk002-agent-principal-adr-proposal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild generated ADR index via pinned epctl
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/XiaoWeiKIN/RepoFoundryAI/v0.15.1/install.py \
            --output "$RUNNER_TEMP/repofoundry-install.py"
          python3 "$RUNNER_TEMP/repofoundry-install.py" --version 0.15.1 --host none
          RF_ROOT="$HOME/.local/share/repofoundry-ai"
          EPCTL="$(find "$RF_ROOT" -type f -path '*/engineering-execution-plan/scripts/epctl.py' -print -quit)"
          test -n "$EPCTL"
          python3 "$EPCTL" --repo . reindex
          python3 "$EPCTL" --repo . validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DECISIONS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(adr): rebuild index after duplicate proposal cleanup"
          git push origin HEAD:docs/blk002-agent-principal-adr-proposal
