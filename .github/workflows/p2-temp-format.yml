name: P2 Temporary Formatting

on:
  push:
    branches:
      - feat/p2-config-revisions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Format Go files and commit if needed
        run: |
          set -euo pipefail
          gofmt -w internal/config internal/storage/gormrepo
          go mod tidy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/config internal/storage/gormrepo go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'style: gofmt new P2.1 ConfigRevision files'
            git push origin HEAD:feat/p2-config-revisions
          fi
