name: RepoFoundry Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RepoFoundryAI CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/XiaoWeiKIN/RepoFoundryAI/v0.15.1/install.py \
            --output "$RUNNER_TEMP/repofoundry-install.py"
          python3 "$RUNNER_TEMP/repofoundry-install.py" --version 0.15.1 --host none
      - name: Validate Harness, locked Specs and professional registries
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/repofoundry" --repo . validate
          "$HOME/.local/bin/repofoundry" --repo . spec validate
          RF_ROOT="$HOME/.local/share/repofoundry-ai"
          EPCTL="$(find "$RF_ROOT" -type f -path '*/engineering-execution-plan/scripts/epctl.py' -print -quit)"
          DESIGNCTL="$(find "$RF_ROOT" -type f -path '*/engineering-design/scripts/designctl.py' -print -quit)"
          test -n "$EPCTL"
          test -n "$DESIGNCTL"
          python3 "$EPCTL" --repo . validate
          python3 "$DESIGNCTL" --repo . validate
