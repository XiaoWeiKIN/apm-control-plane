name: Temporary P2.4 gofmt
on:
  push:
    branches:
      - feat/p24-policy-resolver
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p24-policy-resolver
      - name: Format P2.4 changed Go files
        run: |
          set -euo pipefail
          gofmt -w internal/policy/policy.go internal/policy/policy_test.go internal/storage/gormrepo/policies.go internal/storage/gormrepo/policies_integration_test.go cmd/server/policies.go cmd/server/policies_integration_test.go cmd/server/main.go internal/storage/gormrepo/store.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/policy/policy.go internal/policy/policy_test.go internal/storage/gormrepo/policies.go internal/storage/gormrepo/policies_integration_test.go cmd/server/policies.go cmd/server/policies_integration_test.go cmd/server/main.go internal/storage/gormrepo/store.go
          git commit -m "style: gofmt P2.4 policy and API changes"
          git push origin HEAD:feat/p24-policy-resolver
