name: Temporary P2.4 final format
on:
  push:
    branches:
      - feat/p24-policy-resolver
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p24-policy-resolver
      - name: Format final policy edits
        run: |
          set -euo pipefail
          gofmt -w cmd/server/policies.go cmd/server/policies_integration_test.go internal/storage/gormrepo/policies.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/server/policies.go cmd/server/policies_integration_test.go internal/storage/gormrepo/policies.go
          git commit -m "style: gofmt final P2.4 policy API changes"
          git push origin HEAD:feat/p24-policy-resolver
