name: Temporary EP001 black-box gofmt
on:
  push:
    branches:
      - test/ep001-process-restart
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ep001-process-restart
      - name: Format integration test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/server/process_restart_integration_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/server/process_restart_integration_test.go
          git commit -m "style: gofmt EP-001 black-box restart test"
          git push origin HEAD:test/ep001-process-restart
