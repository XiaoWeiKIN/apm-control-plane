name: Temporary P3 rollout gofmt
on:
  push:
    branches:
      - feat/p3-frozen-batch-rollout
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-frozen-batch-rollout
      - name: Format P3 rollout Go changes
        run: |
          set -euo pipefail
          gofmt -w cmd/server/rollouts.go cmd/server/rollouts_integration_test.go internal/storage/gormrepo/rollouts.go internal/storage/gormrepo/rollouts_integration_test.go internal/storage/gormrepo/reconcile.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/server/rollouts.go cmd/server/rollouts_integration_test.go internal/storage/gormrepo/rollouts.go internal/storage/gormrepo/rollouts_integration_test.go internal/storage/gormrepo/reconcile.go
          git commit -m "style: gofmt P3 frozen rollout implementation"
          git push origin HEAD:feat/p3-frozen-batch-rollout
